<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة العمل الموحدة Billing System | شركة مياه الشرب والصرف الصحي بالجيزة</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        customBg: '#f8f7f4',
                        brand: {
                            500: '#334155',
                            600: '#1e293b',
                            700: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8f7f4;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-between selection:bg-slate-200">

    <!-- Header Section with Logo -->
    <header class="pt-10 pb-6 px-4 text-center">
        <div class="max-w-4xl mx-auto flex flex-col items-center">
            <!-- Company Logo -->
            <img src="images.jfif" alt="شعار شركة مياه الشرب والصرف الصحي بالجيزة" class="h-24 w-auto mb-4 drop-shadow-sm object-contain" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/1/14/No_image_available.svg'; this.onerror=null;">
            
            <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-800 tracking-tight mb-2">
                منصة العمل الموحدة
            </h1>
            <p class="text-xs sm:text-sm text-slate-400 tracking-wider font-medium">
                GCWW • Work Links Platform • v7
            </p>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 pb-16 w-full">
        
        <!-- Search Bar -->
        <div class="max-w-md mx-auto mb-10 relative">
            <i class="fa-solid fa-magnifying-glass absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input type="text" id="searchInput" oninput="filterLinks()" placeholder="ابحث عن النظام أو الخدمة..." class="w-full pr-11 pl-4 py-3 bg-white border border-slate-200/80 rounded-2xl focus:outline-none focus:ring-2 focus:ring-slate-400 shadow-sm transition-all text-sm text-center">
        </div>

        <!-- Links Grid (Responsive Grid) -->
        <div id="linksGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-3 xl:grid-cols-6 gap-5">
            <!-- Cards populated dynamically -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16 bg-white/60 rounded-3xl border border-dashed border-slate-300 mt-4">
            <i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-2"></i>
            <h3 class="text-base font-bold text-slate-600">لا توجد نتائج مطابقة</h3>
        </div>

    </main>

    <!-- Footer -->
    <footer class="py-6 border-t border-slate-200/60 bg-[#f8f7f4]">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500 flex flex-col sm:flex-row justify-between items-center gap-2">
            <p>جميع الحقوق محفوظة &copy; شركة مياه الشرب والصرف الصحي بالجيزة (GCWW)</p>
            <p class="text-slate-700 font-bold flex flex-wrap items-center justify-center gap-1">
                <span>تصميم:</span>
                <span class="text-slate-900 font-extrabold">Ahmed Madeny</span> •
                <span class="text-slate-900 font-extrabold">Eman Abdelhameed</span> •
                <span class="text-slate-900 font-extrabold">Rana Ismeal</span>
            </p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script>
        const programs = [
            {
                id: 1,
                title: "CRM",
                subtitle: "إدارة خدمة العملاء",
                url: "https://crm.gcww.com.eg",
                icon: "fa-users text-slate-700",
                description: "متابعة الشكاوى والطلبات وحسابات العملاء."
            },
            {
                id: 2,
                title: "Mas قراءات وتحصيل",
                subtitle: "نظام MAS",
                url: "https://mas.gcww.com.eg/",
                icon: "fa-database text-slate-700",
                description: "منظومة القراءة والفلترة والبيانات الأساسية."
            },
            {
                id: 3,
                title: "New MAS",
                subtitle: "نظام MAS",
                url: "https://newmas.gcww.com.eg/",
                icon: "fa-bolt text-slate-700",
                description: "النسخة المحدثة لعمليات الإصدار والفواتير."
            },
            {
                id: 4,
                title: "CDU",
                subtitle: "تحديث بيانات العملاء",
                url: "https://cdu.gcww.com.eg/login",
                icon: "fa-address-card text-slate-700",
                description: "تسجيل وتحديث البيانات المخالفات والخلسة."
            },
            {
                id: 5,
                title: "Mas 2021",
                subtitle: "نظام الفوترة",
                url: "https://biller.gcww.com.eg/",
                icon: "fa-file-invoice-dollar text-slate-700",
                description: "منظومة التحصيل المالي وإصدار الفواتير."
            },
            {
                id: 6,
                title: "الصرف الصناعى",
                subtitle: "نظام الفوترة",
                url: "https://induster.gcww.com.eg/",
                icon: "fa-industry text-slate-700",
                description: "أخرى."
            }
        ];

        function renderCards(data) {
            const grid = document.getElementById('linksGrid');
            const emptyState = document.getElementById('emptyState');

            if (data.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = data.map(prog => `
                <a href="${prog.url}" target="_blank" rel="noopener noreferrer" 
                   class="bg-white rounded-3xl p-6 border border-slate-200/70 shadow-sm hover:shadow-md hover:-translate-y-1 transition-all duration-300 flex flex-col items-center text-center group">
                    
                    <!-- Icon Box -->
                    <div class="w-14 h-14 rounded-2xl bg-slate-50 border border-slate-100 flex items-center justify-center text-2xl mb-4 group-hover:bg-slate-900 group-hover:text-white transition-colors duration-300">
                        <i class="fa-solid ${prog.icon.replace('text-slate-700', '')} group-hover:text-white"></i>
                    </div>

                    <!-- Title -->
                    <h3 class="font-extrabold text-slate-900 text-base mb-1 tracking-tight leading-tight">
                        ${prog.title}
                    </h3>

                    <!-- Subtitle -->
                    <p class="text-xs font-semibold text-slate-500 mb-3">
                        ${prog.subtitle}
                    </p>

                    <span class="text-[11px] text-slate-400 mt-auto pt-3 border-t border-slate-100 w-full">
                        فتح النظام <i class="fa-solid fa-arrow-left text-[9px] mr-1"></i>
                    </span>
                </a>
            `).join('');
        }

        function filterLinks() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = programs.filter(p => 
                p.title.toLowerCase().includes(query) || 
                p.subtitle.toLowerCase().includes(query) ||
                p.description.toLowerCase().includes(query)
            );
            renderCards(filtered);
        }

        window.onload = function() {
            renderCards(programs);
        };
    </script>
</body>
</html>
